services:
  # Frontend (React + Vite) - Standalone
  - type: web
    name: aviator-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_BASE_URL
        value: https://aviator-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
